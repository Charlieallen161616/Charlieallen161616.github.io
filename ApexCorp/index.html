<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex Interactive | Multitasking Platform</title>

  <!-- BROWSER TAB FAVICON: Fixed embedding via inline SVG data pattern -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://w3.org' viewBox='0 0 292 300'%3E%3Cpath fill='%23007aff' d='M146 0 L292 300 L210 300 L146 130 L82 300 L0 300 Z'/%3E%3Cpath fill='%2300e676' d='M146 70 L230 240 L62 240 Z'/%3E%3C/svg%3E">

  <!-- Font Awesome Icons for OS Dashboard UI -->
  <link rel="stylesheet" href="https://cloudflare.com">

  <style>
    /* Reset & Theme Profiles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, sans-serif;
      user-select: none;
    }

    :root {
      --primary: #00e676;       
      --accent-purple: #6366f1; 
      --dark-bg: #0f172a;       
      --card-bg: #1e293b;       
      --text-main: #f8fafc;     
      --text-muted: #94a3b8;    
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      background-color: var(--dark-bg);
      color: var(--text-main);
      overflow: hidden;
      height: 100vh;
    }

    /* Fixed Navigation Header Layout */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 4%;
      background-color: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      position: relative;
      z-index: 2000;
      border-bottom: 1px solid #334155;
      height: 60px;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    /* Fixed Vector Branding Logo Canvas Component */
    .logo-canvas {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #007aff, #00e676);
      clip-path: polygon(50% 0%, 0% 100%, 25% 100%, 50% 35%, 75% 100%, 100% 100%);
      box-shadow: 0 0 10px rgba(0, 230, 118, 0.4);
    }

    .logo {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.5px;
    }

    .logo span { color: var(--primary); }

    .nav-links { display: flex; gap: 0.75rem; }

    .nav-tab {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.5rem 1rem;
      cursor: pointer;
      border-radius: 8px;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-tab.active, .nav-tab:hover {
      color: var(--text-main);
      background-color: var(--card-bg);
    }

    .nav-tab.active i { color: var(--primary); }

    /* Core Screen Switcher System Views */
    .view-panel {
      display: none;
      height: calc(100vh - 60px);
      overflow-y: auto;
      padding: 2rem 5%;
      animation: fadeIn 0.3s ease;
    }

    .view-panel.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* --- PANEL 1: HOME MENU BLUEPRINT --- */
    .hero-banner {
      background-color: var(--accent-purple);
      border-radius: 24px;
      padding: 4rem;
      margin: 2rem 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 20px 40px rgba(99, 102, 241, 0.2);
    }

    .hero-content { max-width: 50%; }
    .hero-content h1 { font-size: 3.2rem; font-weight: 800; line-height: 1.1; margin-bottom: 1rem; }
    .hero-content p { font-size: 1.1rem; opacity: 0.9; margin-bottom: 2rem; }
    .hero-btn {
      display: inline-block;
      background-color: var(--text-main);
      color: var(--accent-purple);
      text-decoration: none;
      padding: 1rem 2.5rem;
      font-weight: 700;
      border-radius: 30px;
      transition: var(--transition);
      cursor: pointer;
    }
    .hero-btn:hover { transform: scale(1.03); }

    /* --- PANEL 2: MULTITASKING WEB OS DESKTOP CONTAINER --- */
    #webos-view {
      padding: 0;
      background: radial-gradient(circle at bottom left, #1e1b4b, #0f172a);
      position: relative;
      overflow: hidden;
    }

    /* Desktop launch pad dock */
    .os-desktop-dock {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(20px);
      padding: 0.75rem 1.5rem;
      border-radius: 20px;
      display: flex;
      gap: 1.5rem;
      border: 1px solid rgba(255,255,255,0.1);
      z-index: 1000;
    }

    .dock-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background-color: var(--card-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      cursor: pointer;
      color: white;
      transition: var(--transition);
      border: 1px solid transparent;
    }

    .dock-icon:hover {
      transform: translateY(-8px) scale(1.1);
      background-color: var(--accent-purple);
      border-color: var(--primary);
    }

    /* Floating WebOS Window Framework styles */
    .os-window {
      position: absolute;
      width: 460px;
      height: 380px;
      background-color: #1e293b;
      border-radius: 12px;
      border: 1px solid #475569;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 10;
    }

    .os-window-header {
      background-color: #0f172a;
      padding: 0.6rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: move;
      font-weight: 600;
      font-size: 0.85rem;
      border-bottom: 1px solid #334155;
    }

    .os-window-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .os-window-actions {
      display: flex;
      gap: 8px;
    }

    .window-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      cursor: pointer;
      border: none;
    }
    .dot-close { background-color: #ef4444; }
    .dot-max { background-color: #eab308; }

    .os-window-content {
      flex-grow: 1;
      position: relative;
      background-color: #000;
    }

    /* Window state modifiers */
    .os-window.maximized {
      width: 100% !important;
      height: calc(100% - 85px) !important;
      top: 0 !important;
      left: 0 !important;
    }

    /* Window components inside OS */
    .os-iframe { width: 100%; height: 100%; border: none; background: white; }

    /* --- ARCADE GAME DESIGN --- */
    .gd-canvas-container {
      position: relative;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, #111827, #000);
      overflow: hidden;
    }
    .gd-cube {
      width: 36px;
      height: 36px;
      position: absolute;
      bottom: 30px;
      left: 60px;
      border-radius: 6px;
      background: linear-gradient(135deg, #007aff, #00e676);
      box-shadow: 0 0 12px var(--primary);
    }
    .gd-floor { width: 100%; height: 30px; background-color: var(--primary); position: absolute; bottom: 0; left: 0; }
    .gd-obstacle { width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-bottom: 30px solid #ff0055; position: absolute; bottom: 30px; left: 500px; }
    .gd-score-board { position: absolute; top: 12px; left: 12px; font-weight: bold; font-size: 1.1rem; }
    .gd-stop-btn { position: absolute; top: 10px; right: 10px; background: #ef4444; border: none; padding: 4px 10px; color: white; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }

    .gd-jump-anim { animation: snappyJump 0.45s cubic-bezier(0.25, 1, 0.2, 1); }
    @keyframes snappyJump {
      0% { bottom: 30px; transform: rotate(0deg); }
      40% { bottom: 120px; transform: rotate(75deg); } 
      100% { bottom: 30px; transform: rotate(180deg); } 
    }

    /* --- CORE STORE APPLICATION LAYOUTS --- */
    .app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.5rem; margin-top: 1.5rem; }
    .app-card { background-color: var(--card-bg); border-radius: 16px; padding: 1.25rem; }
    .app-icon { width: 100%; aspect-ratio: 1; background: linear-gradient(135deg, #334155, #475569); border-radius: 12px; margin-bottom: 1rem; display: flex; align-items: center; justify-content: center; font-size: 3rem; }
  </style>
</head>
<body>

  <!-- Navigation Header Interface -->
  <nav class="navbar">
    <a href="#" class="logo-container" onclick="switchView('home-view')">
      <!-- Fixed vector logo replaces broken image asset web targets -->
      <div class="logo-canvas"></div>
      <div class="logo">APEX<span>INTERACTIVE</span></div>
    </a>
    <div class="nav-links">
      <button class="nav-tab active" id="btn-home" onclick="switchView('home-view')"><i class="fa-solid fa-house"></i>Home</button>
      <button class="nav-tab" id="btn-webos" onclick="switchView('webos-view')"><i class="fa-solid fa-window-restore"></i>Web OS Desktop</button>
      <button class="nav-tab" id="btn-hub" onclick="switchView('hub-view')"><i class="fa-solid fa-layer-group"></i>Game Hub</button>
    </div>
  </nav>

  <!-- PANEL 1: HOME PAGE -->
  <main id="home-view" class="view-panel active">
    <div class="hero-banner">
      <div class="hero-content">
        <h1>Run APEX WebOS Multitasking Environment</h1>
        <p>Launch distinct windows, play games, and scan network spaces concurrently completely inside an agile browser layout frame configuration.</p>
        <div class="hero-btn" onclick="switchView('webos-view')">Launch WebOS</div>
      </div>
    </div>
  </main>

  <!-- PANEL 2: MULTITASKING DESKTOP OPERATING SYSTEM -->
  <main id="webos-view" class="view-panel">
    
    <!-- App launcher tray panel -->
    <div class="os-desktop-dock">
      <div class="dock-icon" title="Launch Browser App" onclick="spawnOSWindow('browser')"><i class="fa-solid fa-globe"></i></div>
      <div class="dock-icon" title="Launch Geometry Dash App" onclick="spawnOSWindow('game')"><i class="fa-solid fa-gamepad"></i></div>
    </div>

    <!-- Application windows will spawn inside this parent space -->
  </main>

  <!-- PANEL 3: GAME STORE DECK -->
  <main id="hub-view" class="view-panel">
    <h2>Apex Hub System Packages</h2>
    <div class="app-grid">
      <div class="app-card">
        <div class="app-icon" style="background: linear-gradient(135deg, #ef4444, #f97316)">💥</div>
        <h3>Apex Action System</h3>
      </div>
      <div class="app-card">
        <div class="app-icon" style="background: linear-gradient(135deg, #06b6d4, #3b82f6)">🛠️</div>
        <h3>Apex Core Terminal</h3>
      </div>
    </div>
  </main>

  <!-- WORKSPACE ROUTERS AND PROCESS CONTROLLER SCRIPTS -->
  <script>
    let windowCount = 0;
    let activeZIndex = 100;

    // View Routing Core Module
    function switchView(panelId) {
      document.querySelectorAll('.view-panel').forEach(view => view.classList.remove('active'));
      document.querySelectorAll('.nav-tab').forEach(tab => tab.classList.remove('active'));
      document.getElementById(panelId).classList.add('active');
      
      if(panelId === 'home-view') document.getElementById('btn-home').classList.add('active');
      if(panelId === 'webos-view') document.getElementById('btn-webos').classList.add('active');
      if(panelId === 'hub-view') document.getElementById('btn-hub').classList.add('active');
    }

    // Multitasking Dynamic Window Spawning System Engine
    function spawnOSWindow(type) {
      windowCount++;
      activeZIndex++;
      
      const desktop = document.getElementById('webos-view');
      const win = document.createElement('div');
      win.className = 'os-window';
      win.id = 'win-' + windowCount;
      win.style.top = (40 + (windowCount * 25) % 150) + 'px';
      win.style.left = (60 + (windowCount * 30) % 250) + 'px';
      win.style.zIndex = activeZIndex;

      let titleText = type === 'browser' ? 'Web Browser App' : 'Geometry Dash Remake Arena';
      let contentHTML = '';

      if (type === 'browser') {
        contentHTML = `<iframe src="https://example.com" class="os-iframe"></iframe>`;
      } else {
        contentHTML = `
          <div class="gd-canvas-container" onclick="triggerOSJump(${windowCount})">
            <div class="gd-score-board" id="gd-score-${windowCount}">Score: 0</div>
            <button class="gd-stop-btn" onclick="toggleOSGameStop(event, ${windowCount})">Stop</button>
            <div class="gd-cube" id="gd-cube-${windowCount}"></div>
            <div class="gd-obstacle" id="gd-spike-${windowCount}"></div>
            <div class="gd-floor"></div>
          </div>`;
      }

      win.innerHTML = `
        <div class="os-window-header" onmousedown="initWindowDrag(event, 'win-${windowCount}')">
          <div class="os-window-title"><i class="${type==='browser'?'fa-solid fa-globe':'fa-solid fa-gamepad'}"></i> ${titleText}</div>
          <div class="os-window-actions">
            <button class="window-dot stop-btn dot-max" onclick="toggleWindowMaximize('win-${windowCount}')"></button>
            <button class="window-dot stop-btn dot-close" onclick="closeOSWindow('win-${windowCount}')"></button>
          </div>
        </div>
        <div class="os-window-content">${contentHTML}</div>
      `;

      // Bring to front focus listener hook
      win.addEventListener('mousedown', () => {
        activeZIndex++;
        win.style.zIndex = activeZIndex;
      });

      desktop.appendChild(win);

      if (type === 'game') {
        launchOSGameEngine(windowCount);
      }
    }

    function closeOSWindow(id) {
      const win = document.getElementById(id);
      if (win.dataset.loopId) clearInterval(parseInt(win.dataset.loopId));
      win.remove();
    }

    function toggleWindowMaximize(id) {
      document.getElementById(id).classList.toggle('maximized');
    }

    // Windows Draggable Tracking Sub-Module Engine 
    function initWindowDrag(e, id) {
      if (e.target.classList.contains('window-dot')) return;
      const win = document.getElementById(id);
      if (win.classList.contains('maximized')) return;
      
      activeZIndex++;
      win.style.zIndex = activeZIndex;

      let posX = e.clientX;
      let posY = e.clientY;

      function docMove(e) {
        let diffX = posX - e.clientX;
        let diffY = posY - e.clientY;
        posX = e.clientX;
        posY = e.clientY;
        win.style.top = (win.offsetTop - diffY) + "px";
        win.style.left = (win.offsetLeft - diffX) + "px";
      }

      function docUp() {
        document.removeEventListener('mousemove', docMove);
        document.removeEventListener('mouseup', docUp);
      }

      document.addEventListener('mousemove', docMove);
      document.addEventListener('mouseup', docUp);
    }

    // Multi-instance Isolated Game Engines Logic Controllers
    function triggerOSJump(id) {
      const cube = document.getElementById(`gd-cube-${id}`);
      if (!cube || cube.classList.contains('gd-jump-anim')) return;
      cube.classList.add('gd-jump-anim');
      setTimeout(() => cube.classList.remove('gd-jump-anim'), 450);
    }

    function toggleOSGameStop(e, id) {
      e.stopPropagation();
      const win = document.getElementById(`win-${id}`);
      if (win.dataset.paused === "true") {
        win.dataset.paused = "false";
        e.target.innerText = "Stop";
        e.target.style.background = "#ef4444";
        launchOSGameEngine(id);
      } else {
        win.dataset.paused = "true";
        e.target.innerText = "Resume";
        e.target.style.background = "var(--primary)";
        clearInterval(parseInt(win.dataset.loopId));
      }
    }

    function launchOSGameEngine(id) {
      const win = document.getElementById(`win-${id}`);
      clearInterval(parseInt(win.dataset.loopId));
      
      let score = parseInt(win.dataset.score || 0);
      let obstacleX = parseInt(win.dataset.obsX || 500);
      
      const scoreBoard = document.getElementById(`gd-score-${id}`);
      const obstacle = document.getElementById(`gd-spike-${id}`);
      const cube = document.getElementById(`gd-cube-${id}`);

      let loop = setInterval(() => {
        obstacleX -= 6;
        if (obstacleX < -30) {
          obstacleX = 460;
          score += 10;
          scoreBoard.innerText = "Score: " + score;
          win.dataset.score = score;
        }
        if (obstacle) obstacle.style.left = obstacleX + "px";
        win.dataset.obsX = obstacleX;

        // Collision box metric detection tracking inside dynamic size windows
        if (obstacleX > 60 && obstacleX < 96 && cube && !cube.classList.contains('gd-jump-anim')) {
          clearInterval(loop);
          alert(`Game Over Instance [${id}]! Score: ${score}`);
          win.dataset.score = 0;
          win.dataset.obsX = 500;
          launchOSGameEngine(id);
        }
      }, 25);

      win.dataset.loopId = loop;
    }
  </script>
</body>
</html>
